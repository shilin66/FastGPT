  <text x="32" y="140" fill="#667085" font-family="Avenir Next, PingFang SC, sans-serif" font-size="13">不复用仪表盘、轨道、网络节点、流程线与 AI 火花。三套标识均可脱离底板，并验证至 16px。</text>
