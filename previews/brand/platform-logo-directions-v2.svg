  <g font-family="Avenir Next, PingFang SC, sans-serif">
    <text x="54" y="635" fill="#27364A" font-size="17" font-weight="700">把驾驶舱变成一个可进入的界面</text>
    <text x="54" y="662" fill="#667085" font-size="12"><tspan x="54">四个结构件围合操作焦点，中心金色键表示被确认的</tspan><tspan x="54" dy="19">任务。识别最稳，更偏企业平台与控制系统。</tspan></text>

    <text x="521" y="635" fill="#27364A" font-size="17" font-weight="700">两条控制轨合成专属字形</text>
    <text x="521" y="662" fill="#667085" font-size="12"><tspan x="521">左右舱体共同构成抽象 O，中央缝隙形成指令轴。</tspan><tspan x="521" dy="19">品牌记忆最独立，适合发展成产品家族联字。</tspan></text>

    <text x="988" y="635" fill="#27364A" font-size="17" font-weight="700">把多路能力压缩成一个执行方向</text>
    <text x="988" y="662" fill="#667085" font-size="12"><tspan x="988">三条输入带向右汇聚，金色端点表示可交付结果。</tspan><tspan x="988" dy="19">速度感最强，适合工作流执行和资源调度。</tspan></text>
  </g>

  <g font-family="Avenir Next, PingFang SC, sans-serif" font-size="9" font-weight="700">
    <rect x="54" y="711" width="76" height="25" rx="6" fill="#DBEAFE" /><text x="92" y="727" fill="#2563EB" text-anchor="middle">平台感最强</text>
    <rect x="138" y="711" width="68" height="25" rx="6" fill="#F5F7FA" stroke="#DFE5EE" /><text x="172" y="727" fill="#27364A" text-anchor="middle">结构稳定</text>
    <rect x="214" y="711" width="88" height="25" rx="6" fill="#F5F7FA" stroke="#DFE5EE" /><text x="258" y="727" fill="#27364A" text-anchor="middle">适合后台入口</text>

    <rect x="521" y="711" width="102" height="25" rx="6" fill="#DBEAFE" /><text x="572" y="727" fill="#2563EB" text-anchor="middle">品牌独特性最高</text>
    <rect x="631" y="711" width="84" height="25" rx="6" fill="#F5F7FA" stroke="#DFE5EE" /><text x="673" y="727" fill="#27364A" text-anchor="middle">适合国际化</text>
    <rect x="723" y="711" width="84" height="25" rx="6" fill="#F5F7FA" stroke="#DFE5EE" /><text x="765" y="727" fill="#27364A" text-anchor="middle">暗色表现佳</text>

    <rect x="988" y="711" width="88" height="25" rx="6" fill="#DBEAFE" /><text x="1032" y="727" fill="#2563EB" text-anchor="middle">产品叙事直接</text>
    <rect x="1084" y="711" width="68" height="25" rx="6" fill="#F5F7FA" stroke="#DFE5EE" /><text x="1118" y="727" fill="#27364A" text-anchor="middle">横向动势</text>
    <rect x="1160" y="711" width="90" height="25" rx="6" fill="#F5F7FA" stroke="#DFE5EE" /><text x="1205" y="727" fill="#27364A" text-anchor="middle">适合启动画面</text>
  </g>

  <text x="32" y="872" fill="#667085" font-family="Avenir Next, PingFang SC, sans-serif" font-size="11">选择建议：A 偏企业控制台，B 偏独立品牌资产，C 偏工作流执行平台。确认方向后再展开黑白版、反白版、favicon 与正式 SVG 资产。</text>
  <text x="1408" y="872" fill="#667085" font-family="SFMono-Regular, monospace" font-size="9" text-anchor="end" letter-spacing="0.4">STEEL ATLAS / VECTOR FIRST</text>
</svg>
